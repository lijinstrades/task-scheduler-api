[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "task-scheduler-api"
version = "0.1.0"
description = "A FastAPI task scheduler API with RabbitMQ delivery and MongoDB job documents."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pymongo>=4.10,<5",
    "pika>=1.3,<2",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "mongomock>=4.3,<5",
    "ruff>=0.9,<1",
]

[project.scripts]
job-workers = "job_api.pool:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires running MongoDB and RabbitMQ services"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

